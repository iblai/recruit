allowBuilds:
  canvas: false
  core-js: false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - "@iblai/*"
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - "@playwright/test@1.64.1"
  - next@16.4.1
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
# One physical copy of each @iblai/* package, hoisted to the root: the SDK's
# React contexts live on the module instance, so a second copy makes its
# RTK Query hooks return undefined.
dedupePeerDependents: true
publicHoistPattern:
  - "@iblai/*"
